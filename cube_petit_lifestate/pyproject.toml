[project]
name = "cube_petit_lifestate"
version = "0.1.0"
description = "The person_detection package"
license = { text = "Apache-2.0" }
maintainers = [
    { name = "SoftBank corp.", email = "SBGRP-git@g.softbank.co.jp" },
]
dependencies = ["numpy<2"]

[project.scripts]
life_state_node = "cube_petit_lifestate.cube_petit_lifestate.life_state_node:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["cube_petit_lifestate"]
