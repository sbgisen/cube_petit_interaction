[project]
name = "cube_petit_perception"
version = "0.1.0"
description = "The cube_petit_perception package"
license = { text = "Apache-2.0" }
maintainers = [
    { name = "SoftBank corp.", email = "SBGRP-git@g.softbank.co.jp" },
]
dependencies = [
    "numpy<2",
    "requests",
    "soundfile",
    "pyyaml",
]

[project.scripts]
voice_emotion_node = "cube_petit_perception.voice_emotion_node:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["cube_petit_perception"]
