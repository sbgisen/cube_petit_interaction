version = "0.1.0"
description = "Add your description here"
license = { text = "Apache-2.0" }
maintainers = [
    { name = "SoftBank corp.", email = "SBGRP-git@g.softbank.co.jp" },
]
dependencies = ["numpy<2", "PyQt5", "panel", "pillow", "opencv-python","pyyaml", "BytesIO"]
